<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .facet-shadow {
      fill: #0B0C10;
    }
    .facet-highlight {
      fill: #2E3036;
    }
    .aperture-border {
      stroke: #0B0C10;
      stroke-opacity: 0.15;
    }
    @media (prefers-color-scheme: dark) {
      .facet-shadow {
        fill: #FFFFFF;
      }
      .facet-highlight {
        fill: #94A3B8;
      }
      .aperture-border {
        stroke: #FFFFFF;
        stroke-opacity: 0.2;
      }
    }
  </style>

  <!-- Top Wing -->
  <path class="facet-highlight" d="M 50 2 C 49 14 46 27 39 39 L 50 39 Z" />
  <path class="facet-shadow" d="M 50 2 L 50 39 L 61 39 C 54 27 51 14 50 2 Z" />

  <!-- Right Wing -->
  <path class="facet-highlight" d="M 98 50 C 86 49 73 46 61 39 L 61 50 Z" />
  <path class="facet-shadow" d="M 98 50 L 61 50 L 61 61 C 73 54 86 51 98 50 Z" />

  <!-- Bottom Wing -->
  <path class="facet-highlight" d="M 50 98 C 51 86 54 73 61 61 L 50 61 Z" />
  <path class="facet-shadow" d="M 50 98 L 50 61 L 39 61 C 46 73 49 86 50 98 Z" />

  <!-- Left Wing -->
  <path class="facet-highlight" d="M 2 50 L 39 50 L 39 39 C 27 46 14 49 2 50 Z" />
  <path class="facet-shadow" d="M 2 50 C 14 51 27 54 39 61 L 39 50 Z" />

  <!-- Central Square Aperture Inner Line -->
  <rect x="39" y="39" width="22" height="22" fill="none" class="aperture-border" stroke-width="0.75" />
</svg>
