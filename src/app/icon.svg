<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    polygon {
      fill: #0F172A;
    }
    @media (prefers-color-scheme: dark) {
      polygon {
        fill: #FFFFFF;
      }
    }
  </style>
  <!-- Top Triangle Pointing Up -->
  <polygon points="50,2 66,34 34,34" />
  <!-- Right Triangle Pointing Right -->
  <polygon points="98,50 66,66 66,34" />
  <!-- Bottom Triangle Pointing Down -->
  <polygon points="50,98 34,66 66,66" />
  <!-- Left Triangle Pointing Left -->
  <polygon points="2,50 34,34 34,66" />
</svg>